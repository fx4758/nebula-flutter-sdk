name: governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart run tool/governance.dart
      - run: dart run tool/task_source_guard.dart --self-check
      - run: dart run tool/governance_test.dart
      - run: dart run tool/api_surface.dart
      - run: dart run tool/secret_scan.dart
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: dart test
      - run: dart run tool/smoke.dart
