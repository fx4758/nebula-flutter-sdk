name: governance

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: nebula-sdk
    timeout-minutes: 10
    steps:
      - name: Checkout current revision from LAN Forgejo
        shell: bash
        env:
          CI_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CI_TOKEN:-}"
          test -n "${GITHUB_SERVER_URL:-}"
          test -n "${GITHUB_REPOSITORY:-}"
          test -n "${GITHUB_WORKSPACE:-}"
          test -f "${GITHUB_EVENT_PATH:-}"

          EVENT_KIND="$(python3 - <<'PY'
          import json, os
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          print('pull_request' if isinstance(event.get('pull_request'), dict) else 'push')
          PY
          )"

          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 | tr -d '\n')"
          AUTH_KEY="http.${GITHUB_SERVER_URL}/.extraheader"

          mkdir -p "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git init -q .
          git remote add origin "$REPO_URL"

          if [ "$EVENT_KIND" = "pull_request" ]; then
            PR_NUMBER="$(python3 - <<'PY'
          import json, os
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          number = event.get('number')
          if not isinstance(number, int) or number < 1:
              raise SystemExit('invalid pull request number')
          print(number)
          PY
            )"
            HEAD_SHA="$(python3 - <<'PY'
          import json, os, re
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          sha = str(event['pull_request']['head']['sha']).lower()
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('invalid pull request head sha')
          print(sha)
          PY
            )"
            PR_REMOTE_REF="refs/remotes/origin/pull/${PR_NUMBER}/head"
            git -c "$AUTH_KEY=AUTHORIZATION: basic $AUTH" \
              fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:${PR_REMOTE_REF}"
            FETCHED_SHA="$(git rev-parse "${PR_REMOTE_REF}^{commit}")"
            test "$FETCHED_SHA" = "$HEAD_SHA"
            git checkout -q --detach "$HEAD_SHA"
          else
            HEAD_REF="$(python3 - <<'PY'
          import json, os
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          ref = event.get('ref', '')
          prefix = 'refs/heads/'
          if not ref.startswith(prefix):
              raise SystemExit(f'unsupported ref: {ref}')
          print(ref[len(prefix):])
          PY
            )"
            test -n "$HEAD_REF"
            git -c "$AUTH_KEY=AUTHORIZATION: basic $AUTH" \
              fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
            git checkout -q --detach "refs/remotes/origin/$HEAD_REF"
          fi
          unset AUTH CI_TOKEN

      - name: Resolve pinned offline CI dependencies
        run: dart pub get --offline

      - name: Verify CI image and dependency resolution
        run: |
          dart run tool/ci_dependency_guard_test.dart
          dart run tool/ci_dependency_guard.dart

      - run: dart run tool/sdk_layer_graph_guard.dart
      - run: dart run tool/sdk_layer_graph_guard_test.dart
      - run: dart run tool/product_erasure_guard.dart
      - run: dart run tool/product_erasure_guard_test.dart
      - run: dart run tool/sdk_boundary_ci_binding_test.dart
      - run: dart run tool/governance.dart
      - run: dart run tool/task_source_guard.dart --self-check
      - run: dart run tool/cross_repo_guard.dart --self-check
      - run: dart run tool/cross_repo_guard_test.dart
      - run: dart run tool/coordinator_state_guard.dart --self-check
      - run: dart run tool/coordinator_state_guard_test.dart
      - run: dart run tool/coordinator_publication_mode_test.dart
      - run: dart run tool/governance_pr_checkout_contract_test.dart
      - if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          MODE="$(dart run tool/coordinator_publication_mode.dart --event-path "$GITHUB_EVENT_PATH")"
          case "$MODE" in
            coordinator)
              dart run tool/coordinator_state_guard.dart \
                --base "$PR_BASE_SHA" \
                --coordinator
              ;;
            implementation)
              dart run tool/coordinator_state_guard.dart \
                --base "$PR_BASE_SHA"
              ;;
            *)
              echo "unexpected coordinator publication mode: $MODE" >&2
              exit 1
              ;;
          esac
      - run: dart run tool/platform_api_guard.dart --self-check
      - run: dart run tool/platform_api_guard_test.dart
      - run: dart run tool/api_platform_ci_binding_test.dart
      - run: dart run tool/governance_test.dart
      - run: dart run tool/api_surface.dart
      - run: dart run tool/secret_scan.dart
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: dart test
      - run: dart run tool/smoke.dart
